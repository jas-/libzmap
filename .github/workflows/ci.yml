name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 30
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install zmap dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libpcap-dev libjson-c-dev libgmp-dev \
            libjudy-dev libunistring-dev gengetopt flex byacc

      - name: Install zmap dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install json-c gmp judy libunistring gengetopt byacc pkgconf

      # The submodule commit must match the "zmap.commit" pin in package.json.
      - run: node scripts/fetch-zmap.js --check

      # Generates the parsers and compiles zmap and the module.
      - run: npm install

      # The tests use dry runs, so they send no packets and need no root.
      - run: npm test
